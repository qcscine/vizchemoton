 []\n        } else if ((ndx1.length &gt; 0) &amp;&amp; (ndx2.length == 0)){\n            var ndx = ndx1 \n        } else if (ndx2.length &gt; 0) {\n            var ndx = ndx2\n        }\n\n\t\t// locate positions of the node or of the nodes defining an edge\n\t\tif (mol_query.includes(\"TS\") || mol_query.includes(\"ts\")) {\n\t\t\tvar n1 = renderer.data[\"start\"][ndx]\n\t\t\tvar n2 = renderer.data[\"end\"][ndx]\n\t\t\tvar pos1 = layout[n1]\n\t\t\tvar pos2 = layout[n2]\n\t\t\tvar positions = new Array(2)\n\t\t\tpositions[0] = 0.5*(pos1[0]+pos2[0])\n\t\t\tpositions[1] = 0.5*(pos1[1]+pos2[1])\n\t\t} else {\n\t\t\tvar positions = layout[pool_names[ndx[0]]]\n\t\t}\n\t\tif (ndx.length &gt; 0) {\n\t\t\t// clearing other sel. avoids problems for model loading sometimes\n\t\t\tother_renderer.selected.indices = []\n\t\t\trenderer.selected.indices = ndx\n\t\t\tfig.x_range.start = positions[0] - 0.5\n\t\t\tfig.x_range.end = positions[0] + 0.5\n\t\t\tfig.y_range.start = positions[1] - 0.5\n\t\t\tfig.y_range.end = positions[1] + 0.5\n\t\t}\n\t\t"},"id":"1202","type":"CustomJS"},{"attributes":{"axis":{"id":"1017"},"dimension":1,"grid_line_color":null,"ticker":null},"id":"1020","type":"Grid"},{"attributes":{"align":"center","icon":null,"js_event_callbacks":{"button_click":[{"id":"1141"}]},"label":"Highlight neighbors","max_width":133},"id":"1200","type":"Button"},{"attributes":{"align":"center","icon":null,"js_event_callbacks":{"button_click":[{"id":"1154"}]},"label":"Hide barrierless","max_width":133},"id":"1201","type":"Button"},{"attributes":{},"id":"1124","type":"EdgesAndLinkedNodes"},{"attributes":{"graph_layout":{"c1":[0.19472679394170245,0.02275987056380771],"c1+c1":[-0.22444612504701847,-0.19610642391670774],"c1+c15":[0.1915374495087023,0.21555188533944072],"c100+c101":[0.3417078172818096,0.11199420566753462],"c104":[-0.08905743382085864,-0.12945522128029788],"c106":[-0.23139849010887245,-0.09300837732104968],"c107":[-0.10689939424169025,0.12129366396413913],"c109":[0.08
