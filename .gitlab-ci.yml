docs:html:
  stage: package
  extends: .gcc
  script:
    - *pipeline_setup
    - python3 -m pip install .
    - python3 -m pip install -r requirements-dev.txt
    - make -C docs html
    - mv docs/build/html html_docs/
  artifacts:
    expire_in: 1 day
    paths:
      - html_docs/

dist:sdist:
  stage: package
  extends: .gcc
  script:
    - python3 setup.py sdist --dist-dir .
  artifacts:
    expire_in: 1 day
    paths:
      - ./vizchemoton-*
