---

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: 1
  PYTHON_ARTIFACT_DIR: "$CI_PROJECT_DIR/.cache"
  PIP_CACHE_DIR: "$PYTHON_ARTIFACT_DIR/pip"

include:
  - project: 'scine/development-utils'
    file: '/ci/jobs.yml'

stages:
  - quality
  - build
  - package

.pipeline_setup: &pipeline_setup
  - !reference [.python_venv]

check_flake8:
  stage: quality
  extends: .gcc
  script:
    - *pipeline_setup
    - python3 -m pip install -r requirements-dev.txt
    - python3 -m flake8 vizchemoton

check_mypy:
  stage: quality
  extends: .gcc
  script:
    - *pipeline_setup
    - python3 -m pip install -r requirements-dev.txt
    - python3 -m mypy --ignore-missing-imports -p vizchemoton

setup_environment:
  stage: build
  image: ubuntu:22.04
  extends: .gcc
  services:
    - mongo:bionic
  before_script:
    - apt-get update && apt-get install -y wget git build-essential python3-pip
    - wget https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda.sh
    - bash miniconda.sh -b -p $HOME/miniconda
    - export PATH="$HOME/miniconda/bin:$PATH"
    - source $HOME/miniconda/etc/profile.d/conda.sh
    - conda init bash
    - conda config --set always_yes yes --set changeps1 no
    - conda create --name my_env python=3.8
    - conda activate my_env
    - conda install -c conda-forge xyz2mol
    - python -m pip install --upgrade pip
    # Clone and install Chemoton
    - git clone https://github.com/qcscine/chemoton.git
    - cd chemoton
    - git checkout 3.1.0
    - python -m pip install -r requirements.txt
    - python -m pip install .
    - cd ..

    # Clone and install amk_tools
    - git clone https://gitlab.com/dgarayr/amk_tools.git
    - cd amk_tools
    - python -m pip install -e .
    - cd ..
  script: 
    # Run unitary tests
    - find . -name "test_*csv"
    - python3 -m pip install -r requirements-dev.txt
    - python3 -m pytest vizchemoton
  artifacts:
    paths:
      - chemoton/
      - amk_tools/

sphinx:devel:
  stage: build
  extends: .gcc
  except:
    - master
    - develop
  script:
    - *pipeline_setup
    - python3 -m pip install .
    - python3 -m pip install -r requirements-dev.txt
    - make -C docs html
    - mv docs/build/html html_docs/

sphinx:production:
  stage: build
  extends: .gcc
  only:
    - master
    - develop
  script:
    - *pipeline_setup
    - python3 -m pip install .
    - python3 -m pip install -r requirements-dev.txt
    - make -C docs html
    - mv docs/build/html html_docs/
#  artifacts:
#    expire_in: 1 day
#    paths:
#      - html_docs

packaging:
  stage: package
  extends: .gcc
  only:
    - master
    - develop
  script:
    - python3 setup.py sdist --dist-dir .
  artifacts:
    expire_in: 1 day
    paths:
      - ./vizchemoton-*

