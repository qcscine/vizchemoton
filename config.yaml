scine:
  active: False
  name: "ozone_tme_lcpbe"
  ip: "localhost"
  port: "27017"
  method:
    method_family: "dft"
    method: "lc-pbe"
    basis_set: "def2-svp"
    solvation: False
    solvent: False
    program: "orca"
    vfilter: False
  pathfinder:
    path: "./vizchemoton/resources/crn_tme_lcpbe.json"
    mode: "read"
  verbose: True

cheminfo:
  rdkit:
      active: False
      method: "hybrid"
      props: ["MolLogP", "CalcTPSA", "MolWt"]
  database:
      pubchem: False
      chembl: False
      chebi: False
  verbose: False

files:
  reactions:
    path: "./vizchemoton/resources/reactions_tme_dft.csv"
    mode: "read"
  compounds:
    path: "./vizchemoton/resources/compounds_tme_dft.json"
    mode: "read"

html:
  dist_adduct: 3.0
  size:  [1400, 800]
  layout: "kamada_kawai"  # use random for huge networks
  map_field: "pubchemRank" 
  node_size: 25
  title: "Ozonation reaction network - PubChem color matching"
  path: "network_tme_dft.html"


