db:
  active: True
  name: "eth_o2_s3"
  ip: "localhost"
  port: "27017"

method:
  method_family: "gfn2"
  method: "gfn2"
  basis_set: ""
  program: "xtb"
  vfilter: False

files:
  pathfinder:
    path: "./vizchemoton/resources/crn_pathfinder.json"
    mode: "write"
  reactions:
    path: "./vizchemoton/resources/reactions2.csv"
    mode: "write"
  compounds:
    path: "./vizchemoton/resources/compounds2.json"
    mode: "write"
  html:
    path: "network.html"

cheminfo:
  smiles: True
  rdkitprop: ["MolLogP", "CalcTPSA", "MolWt"]
  pubchem: True
  chembl: True
  chemspider: False
  verbose: True

graph:
  dist_adduct: 3.0
  size:  [1400, 800]
  layout: "kamada_kawai" #"kamada_kawai"
  map_field: "pubchemRank"
  node_size: 25
  title: "Chemoton graph"


