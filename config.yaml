scine:
  active: True
  name: "ozone_tme_lcpbe"
  ip: "localhost"
  port: "27017"
  method:
    method_family: "dft"
    method: "lc-pbe"
    basis_set: "def2-svp"
    solvation: False
    solvent: False
    program: "orca"
    vfilter: False
  pathfinder:
    path: "crn_tme_lcpbe.json"
    mode: "read"
  verbose: True

cheminfo:
  rdkit:
      active: True
      method: "hybrid"
      props: ["MolLogP", "CalcTPSA", "MolWt"]
  database:
      pubchem: False
      chembl: False
      chebi: False
  verbose: False

files:
  reactions:
    path: "reactions_tme_dft.csv"
    mode: "write"
  compounds:
    path: "compounds_tme_dft.json"
    mode: "write"

html:
  dist_adduct: 3.0
  size:  [1400, 800]
  layout: "kamada_kawai" 
  map_field: "energy" 
  node_size: 25
  title: "Chemoton graph"
  path: "network_tme_dft.html"


