scine:
  active: True
  name: "ozone_tme_lcpbe"
  ip: "localhost"
  port: "27017"
  method:
    method_family: "dft"
    method: "lc-pbe"
    basis_set: "def2-svp"
    program: "orca"
    vfilter: False
  pathfinder:
    path: "crn_tme_lcpbe.json"
    mode: "read"

cheminfo:
  smiles: True
  smiles_method: "xyz2mol"
  rdkitprop: ["MolLogP", "CalcTPSA", "MolWt"]
  pubchem: False
  chembl: False
  chemspider: False
  chebi: False
  verbose: False

files:
  reactions:
    path: "reactions_tme_dft.csv"
    mode: "write"
  compounds:
    path: "compounds_tme_dft.json"
    mode: "write"

html:
  dist_adduct: 3.0
  size:  [1400, 800]
  layout: "random" #"kamada_kawai"
  map_field: "energy" #"pubchemRank"
  node_size: 10
  title: "Chemoton graph"
  path: "network_tme_dft_deleteme.html"
